<header><button id="menuBtn">☰</button><div><b>ÉCHECS</b><small>by twagirumukiza</small></div><button id="soundBtn">🔊</button></header>
<main>
<section id="home" class="screen active"><div class="hero"><div class="king">♔</div><h1>Échecs</h1><p>Classique, élégant, stratégique.</p><div class="home-signature">by <strong>twagirumukiza</strong></div></div><div class="cards"><button id="aiBtn">♟️ <span><b>Contre l’IA</b><small>4 niveaux</small></span></button><button id="localBtn">👥 <span><b>2 joueurs local</b><small>Sur le même appareil</small></span></button><button id="onlineBtn">🌐 <span><b>Multijoueur</b><small>Salon privé • lien d’invitation</small></span></button></div></section>
<section id="setup" class="screen panel"><button class="back">← Accueil</button><h2 id="setupTitle">Nouvelle partie</h2><div id="aiSetup"><label>Niveau IA<select id="level"><option value="1">Facile</option><option value="2" selected>Moyen</option><option value="3">Difficile</option><option value="4">Expert</option></select></label></div><label>Nom des Blancs<input id="playerName" maxlength="20" value="Joueur 1"></label><label id="p2Label">Nom des Noirs<input id="player2Name" maxlength="20" value="Joueur 2"></label><button class="primary" id="startBtn">Lancer la partie</button></section>
<section id="online" class="screen panel"><button class="back">← Accueil</button><h2>Multijoueur</h2><label>Votre nom<input id="onlineName" maxlength="20" value="Joueur"></label><button class="primary" id="createBtn">Créer un salon</button><div class="or">ou</div><label>Code du salon<input id="roomInput" maxlength="6" placeholder="ABC123"></label><button class="secondary" id="joinBtn">Rejoindre</button><p id="onlineMsg"></p></section>
<section id="lobby" class="screen panel"><button id="leaveLobby" class="back">← Quitter</button><h2>Salon privé</h2><div class="roomCode" id="roomCode">------</div><button class="secondary" id="shareBtn">Partager l’invitation</button><div id="players"></div><p id="lobbyMsg">En attente d’un adversaire…</p><button class="primary" id="launchOnline" disabled>Lancer la partie</button></section>
<section id="game" class="screen"><div class="gamebar"><button id="gameHome">⌂</button><div id="status">Aux blancs de jouer</div><button id="flipBtn">↻</button></div><div class="playerTag top" id="topPlayer">Noirs</div><div id="board" class="board"></div><div class="playerTag bottom" id="bottomPlayer">Blancs</div><div class="actions"><button id="undoBtn">↶ Annuler</button><button id="resignBtn">Abandonner</button></div><div id="history" class="history"></div><div id="winner" class="winner hidden"><h2 id="winnerText"></h2><div><button id="rematch">Revanche</button><button id="winnerHome">Accueil</button></div></div></section>
</main>
